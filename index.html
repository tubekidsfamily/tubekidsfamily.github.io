<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2f77">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Tube Kids Family</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<!-- إعداداتك (المفتاح، Firebase، القنوات) في ملف config.js لوحده، عشان تحديثات index.html متمسحهاش -->
<script src="config.js"></script>
<script>
const CONFIG = Object.assign({
  API_KEY: "", PIN: "0000", FIREBASE: null, COUNTRY_CODE: "+20", DEFAULT_LANG: "ar",
  CHANNELS: [], REFRESH_MINUTES: 30, NEW_DAYS: 3
}, window.APP_CONFIG || {});
</script>
<style>
:root{--bg:#f3f5ff;--card:#fff;--ink:#1d2140;--muted:#6b7090;--brand:#2b2f77;--accent:#ff5a5f;--yellow:#ffc93c;--radius:18px;--pbg:#14152b;--pbtn:#262a52}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
button{font-family:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 12px rgba(0,0,0,.15)}
header h1{font-size:20px;margin:0;flex:1;font-weight:800;display:flex;align-items:center;gap:8px;white-space:nowrap;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
header h1 .logo{width:32px;height:32px;border-radius:9px;background:var(--yellow);display:grid;place-items:center;color:var(--brand);font-size:16px}
.icon-btn{background:rgba(255,255,255,.15);border:0;color:#fff;min-width:42px;height:42px;border-radius:12px;font-size:19px;display:grid;place-items:center;padding:0 10px}
.icon-btn.txt{font-size:15px;font-weight:800}
.icon-btn.install{background:var(--yellow);color:var(--ink);font-size:14px;font-weight:800;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:0 12px}
.icon-btn.install span{font-size:14px}
#accountBtn{padding:0;overflow:hidden;border-radius:50%;width:42px}
#accountBtn img{width:42px;height:42px;object-fit:cover;display:block}
#accountBtn .ini{font-size:18px;font-weight:800}
.icon-btn:active{transform:scale(.93)}
#search{width:100%;max-width:260px;border:0;border-radius:12px;padding:9px 12px;font-family:inherit;font-size:15px}
@media(max-width:600px){#search{display:none}#search.show{display:block;position:absolute;top:100%;left:8px;right:8px;max-width:none;margin-top:6px;box-shadow:0 4px 14px rgba(0,0,0,.2)}header h1 span+span{font-size:17px}.icon-btn.install span{display:none}}
@media(min-width:601px){#searchToggle{display:none}}
#channels{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;padding:14px;scrollbar-width:none}
#channels::-webkit-scrollbar,.hrow::-webkit-scrollbar{display:none}
.ch{flex:0 0 auto;width:84px;text-align:center;background:none;border:0;padding:0;color:var(--ink)}
.ch .av{position:relative;width:72px;height:72px;margin:0 auto;border-radius:50%;background:#dde1ff center/cover;border:4px solid transparent;box-shadow:0 3px 10px rgba(0,0,0,.12);display:grid;place-items:center;font-size:28px}
.ch.active .av{border-color:var(--accent)}
.ch .nm{font-size:12px;font-weight:700;margin-top:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{position:absolute;top:-4px;inset-inline-start:-4px;background:var(--accent);color:#fff;font-size:12px;font-weight:800;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;padding:0 6px;border:2px solid #fff}
.sec{padding:0 16px;margin:6px 0 10px;font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.back{border:0;background:#e3e6ff;color:var(--brand);border-radius:12px;height:38px;min-width:38px;font-size:18px;font-weight:800}
.hrow{display:flex;gap:12px;overflow-x:auto;padding:4px 14px 14px;scroll-snap-type:x proximity;scrollbar-width:none}
.pl{flex:0 0 230px;scroll-snap-align:start;background:var(--card);border-radius:var(--radius);border:0;padding:0;text-align:start;color:var(--ink);box-shadow:0 3px 12px rgba(30,40,120,.08);overflow:hidden}
@media(max-width:560px){.pl{flex-basis:170px}}
.pl .th{position:relative;aspect-ratio:16/9;background:#ccd center/cover;box-shadow:0 -6px 0 -2px #c9cdf0 inset}
.pl .cnt{position:absolute;inset-block:0;inset-inline-end:0;width:42%;background:rgba(20,21,43,.78);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:15px;gap:2px}
.pl .cnt small{font-size:18px}
.pl .meta{padding:8px 10px 10px}
.pl .t{font-size:13.5px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pl .c{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:0 14px 24px}
@media(max-width:560px){#grid{grid-template-columns:1fr 1fr;gap:10px;padding:0 10px 20px}}
@media(max-width:360px){#grid{grid-template-columns:1fr}}
.v{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 3px 12px rgba(30,40,120,.08);border:0;padding:0;text-align:start;color:var(--ink);display:flex;flex-direction:column}
.v:active,.pl:active{transform:scale(.97)}
.v .th{position:relative;aspect-ratio:16/9;background:#ccd center/cover}
.v .dur{position:absolute;bottom:6px;inset-inline-end:6px;background:rgba(0,0,0,.78);color:#fff;font-size:12px;padding:1px 6px;border-radius:6px;direction:ltr}
.v .new{position:absolute;top:6px;inset-inline-start:6px;background:var(--accent);color:#fff;font-size:12px;font-weight:800;padding:2px 8px;border-radius:8px}
.v .watched{position:absolute;bottom:0;right:0;left:0;height:4px;background:var(--accent)}
.v .meta{padding:8px 10px 10px}
.v .t{font-size:14px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.v .c{font-size:12px;color:var(--muted);margin-top:4px}
.more{display:block;margin:0 auto 30px;background:var(--brand);color:#fff;border:0;border-radius:14px;padding:12px 26px;font-size:16px;font-weight:700}
.msg{margin:30px 16px;padding:22px;background:#fff;border-radius:var(--radius);text-align:center;line-height:1.8}
.msg b{color:var(--brand)}
.skel{background:linear-gradient(90deg,#e6e8f5 25%,#f2f3fb 50%,#e6e8f5 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- Login gate ---------- */
#gate{position:fixed;inset:0;z-index:90;background:linear-gradient(160deg,#2b2f77,#4b3f9e 60%,#ff5a5f);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.gcard{position:relative;background:#fff;border-radius:26px;padding:28px 22px 22px;width:100%;max-width:400px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.glogo{width:64px;height:64px;border-radius:18px;background:var(--yellow);color:var(--brand);display:grid;place-items:center;font-size:30px;margin:0 auto 8px}
.gcard h1{margin:0 0 6px;font-size:24px;color:var(--brand)}
.gcard p{line-height:1.8;margin:8px 0;color:var(--ink)}
.gcard input{width:100%;border:2px solid #dfe2f5;border-radius:14px;padding:12px;font-family:inherit;font-size:17px;margin:8px 0;direction:ltr;text-align:center}
.gcard input.code{font-size:28px;letter-spacing:10px}
.gcard input.code::placeholder{font-size:16px;letter-spacing:0}
.glang{position:absolute;top:14px;inset-inline-end:14px;border:0;background:#eef0ff;color:var(--brand);border-radius:10px;padding:6px 12px;font-weight:800}
.big{width:100%;padding:14px;font-size:17px;margin-top:6px}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:700;margin-top:10px;text-decoration:underline;font-size:14px}
.spinner{width:42px;height:42px;border:5px solid #e3e6ff;border-top-color:var(--accent);border-radius:50%;margin:20px auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Player ---------- */
#player{position:fixed;inset:0;z-index:50;background:#000;display:none;flex-direction:column;color:#fff}
#player.open{display:flex}
#pTop{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--pbg);z-index:6;transition:opacity .25s}
#pTop .t{flex:1;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{position:relative;flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center;background:#000}
#frameBox{position:relative;width:min(100cqw, calc(100cqh * 16 / 9));aspect-ratio:16/9}
#frameBox iframe,#ytp{position:absolute;inset:0;width:100%;height:100%;border:0}
#tap{position:absolute;inset:0;z-index:3;display:none}
#player.kid #tap{display:block}
#bigIcon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);width:84px;height:84px;border-radius:50%;background:rgba(20,21,43,.75);display:grid;place-items:center;font-size:36px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:4}
#bigIcon.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#pErr{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px;background:#111;z-index:5}
#pErr.show{display:flex}
#bar{background:var(--pbg);padding:6px 12px calc(env(safe-area-inset-bottom) + 10px);z-index:6;transition:opacity .25s}
.seekRow{display:flex;align-items:center;gap:10px;direction:ltr;font-size:13px;font-variant-numeric:tabular-nums;color:#c9cbe8}
#seek{flex:1;accent-color:var(--accent);height:22px}
.ctrls{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:4px}
.ctrls .side{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media(max-width:700px){.ctrls,.ctrls .side{justify-content:center;width:100%}}
.pb{position:relative;background:var(--pbtn);color:#fff;border:0;border-radius:14px;min-width:46px;height:46px;font-size:19px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800}
.pb:active{transform:scale(.93)}
.pb.main{background:var(--accent);min-width:58px;height:52px;font-size:22px}
.pb.small{font-size:14px}
.pb.on{background:var(--yellow);color:var(--ink)}
.pb.tv{background:var(--yellow);color:var(--ink);font-size:15px}
.pb svg{width:22px;height:22px;fill:currentColor}
.grp{display:flex;align-items:center;gap:6px;background:#1d1f3d;border-radius:16px;padding:4px}
#vol{width:96px;accent-color:var(--accent);direction:ltr}
.menu{position:absolute;bottom:56px;inset-inline-start:0;background:#fff;color:var(--ink);border-radius:14px;padding:6px;display:none;flex-direction:column;min-width:96px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:10}
.menu.open{display:flex}
.menu button{border:0;background:none;padding:9px 12px;border-radius:10px;font-weight:700;font-size:15px;text-align:start;color:var(--ink)}
.menu button.sel{background:var(--accent);color:#fff}
#player.fs #pTop{position:absolute;top:0;left:0;right:0;background:linear-gradient(rgba(0,0,0,.7),transparent)}
#player.fs #bar{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.8))}
#player.fs #stage{position:absolute;inset:0}
#player.fs.idle #pTop,#player.fs.idle #bar{opacity:0;pointer-events:none}
#player.fake-fs{z-index:100}

/* ---------- Modals ---------- */
.modal{position:fixed;inset:0;z-index:120;background:rgba(10,12,40,.55);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.sheet{background:#fff;color:var(--ink);border-radius:22px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px}
.sheet h2{margin:0 0 12px;font-size:20px}
.sheet h3{margin:20px 0 4px;font-size:16px;color:var(--brand)}
.sheet p{line-height:1.8;margin:0}
.sheet label{display:block;font-weight:700;margin:14px 0 6px}
.sheet input[type=text],.sheet input[type=password],.sheet textarea{width:100%;border:2px solid #dfe2f5;border-radius:12px;padding:10px;font-family:inherit;font-size:15px;direction:ltr;text-align:left}
.sheet textarea{min-height:200px;font-size:13px}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-size:15px;font-weight:700;background:var(--brand);color:#fff}
.btn:disabled{opacity:.6}
.btn.ghost{background:#eef0ff;color:var(--brand)}
.btn.red{background:#ffe5e6;color:#c22}
.btn.yellow{background:var(--yellow);color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.7}
.check{display:flex;align-items:flex-start;gap:8px;font-weight:700;margin-top:14px}
.check input{width:20px;height:20px;flex:0 0 auto;margin-top:3px}
.check small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.pin{display:flex;gap:10px;justify-content:center;margin:14px 0}
.pin input{width:200px;text-align:center;font-size:26px;letter-spacing:10px;border:2px solid #dfe2f5;border-radius:12px;padding:8px}
.add-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.add-row input{flex:1 1 200px;border:2px solid #dfe2f5;border-radius:12px;padding:10px;font-family:inherit;font-size:15px;direction:ltr;text-align:left}
.adm{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:#f4f5ff;border-radius:10px;margin-top:6px;direction:ltr;font-size:14px;color:var(--ink)}
.adm button{border:0;background:#ffe5e6;color:#c22;border-radius:8px;padding:4px 10px;font-family:inherit;font-weight:700}
.sheet.wide{max-width:720px}
.tabs{display:flex;gap:6px;background:#eef0ff;border-radius:14px;padding:4px;margin-bottom:8px}
.tabs button{flex:1;border:0;background:none;padding:9px 8px;border-radius:10px;font-weight:800;color:var(--brand);font-size:14px}
.tabs button.on{background:var(--brand);color:#fff}
.tabs.small{max-width:320px}
.sheet select{border:2px solid #dfe2f5;border-radius:12px;padding:10px;font-family:inherit;font-size:15px;background:#fff;color:var(--ink)}
.sheet input[type=date]{border:2px solid #dfe2f5;border-radius:12px;padding:9px;font-family:inherit;font-size:15px}
.filter{width:100%;border:2px solid #dfe2f5;border-radius:12px;padding:9px 12px;font-family:inherit;font-size:14px;margin:6px 0}
.urow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;width:100%;text-align:start;border:0;background:#f4f5ff;border-radius:12px;padding:10px 12px;margin-top:6px;color:var(--ink);font-family:inherit}
.urow:hover{background:#e9ebff}
.uid{font-weight:800;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.useen{grid-column:1/-1;font-size:12px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:12px;font-weight:800;border-radius:8px;padding:2px 8px;background:#e3e6ff;color:var(--brand)}
.tag.ok{background:#dff6e7;color:#167a3e}.tag.off{background:#ffe5e6;color:#c22}.tag.notAdded{background:#fff3d1;color:#8a6200}
.tag.role-admin{background:var(--brand);color:#fff}.tag.role-editor{background:#7b6cf0;color:#fff}
.lrow{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 10px;border-bottom:1px solid #eef0ff;font-size:13px;color:var(--ink)}
.lrow .ltime{color:var(--muted);font-size:12px;white-space:nowrap}
.lrow .ldet{grid-column:1/-1;color:var(--muted)}
.lrow .uid{cursor:pointer}
.chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;margin-top:8px}
.chk-grid label{display:flex;align-items:center;gap:8px;margin:0;font-weight:700;font-size:14px;background:#f4f5ff;border-radius:10px;padding:8px}
.chk-grid img{width:28px;height:28px;border-radius:50%}
.prof{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pav{position:relative;width:112px;height:112px;border-radius:50%;border:4px solid var(--yellow);background:#eef0ff;padding:0;overflow:hidden;display:grid;place-items:center;font-size:44px;font-weight:800;color:var(--brand)}
.pav img{width:100%;height:100%;object-fit:cover}
.pcam{position:absolute;bottom:0;left:0;right:0;background:rgba(20,21,43,.6);color:#fff;font-size:16px;padding:3px 0}
.pname{width:100%;max-width:300px;border:2px solid #dfe2f5;border-radius:12px;padding:10px;font-family:inherit;font-size:17px;font-weight:800;text-align:center;margin-top:4px}
.pid{font-weight:700;color:var(--muted);font-size:14px}
.pinfo{margin-top:14px;background:#f4f5ff;border-radius:14px;padding:6px 12px}
.pinfo div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #e6e8f7;font-size:14px}
.pinfo div:last-child{border-bottom:0}
.pinfo span{color:var(--muted)}
.pinfo b{text-align:end}
.uav{width:26px;height:26px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-inline-end:6px;background:#dde1ff}
#lock{position:fixed;inset:0;z-index:150;background:linear-gradient(160deg,#1b1e4b,#2b2f77 55%,#5b3f9e);display:flex;align-items:center;justify-content:center;padding:20px}
.icon-btn.timer{background:#ffffff26;font-size:14px;font-weight:800;display:inline-flex;align-items:center;gap:6px;padding:0 12px;font-variant-numeric:tabular-nums}
.icon-btn.timer.low{background:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.chips button{border:2px solid #dfe2f5;background:#fff;border-radius:12px;padding:8px 14px;font-weight:800;color:var(--brand)}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tmbig{font-size:46px;font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums;direction:ltr}
.ustats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 4px}
@media(max-width:520px){.ustats{grid-template-columns:repeat(2,1fr)}}
.ustats div{background:#f4f5ff;border-radius:12px;padding:10px;text-align:center}
.ustats b{display:block;font-size:22px;color:var(--brand)}
.ustats span{font-size:12px;color:var(--muted)}
.tag.app{background:#fff3d1;color:#8a6200}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2140;color:#fff;padding:10px 18px;border-radius:12px;z-index:200;display:none;font-size:14px;max-width:90vw;text-align:center}
</style>
</head>
<body>
<header>
  <h1 id="logo"><span class="logo">▶</span><span>Tube Kids Family</span></h1>
  <input id="search" type="search" data-i18n-ph="search">
  <button class="icon-btn" id="searchToggle" data-i18n-title="searchT">🔍</button>
  <button class="icon-btn install" id="installBtn" hidden>📲 <span data-i18n="install"></span></button>
  <button class="icon-btn timer" id="timerPill" hidden>⏱ <span id="timerLeft"></span></button>
  <button class="icon-btn txt" id="langBtn"></button>
  <button class="icon-btn" id="accountBtn" data-i18n-title="account">👤</button>
</header>

<nav id="channels"></nav>
<section id="plSection" hidden>
  <div class="sec" data-i18n="playlists"></div>
  <div class="hrow" id="plRow"></div>
</section>
<div class="sec"><button class="back" id="backBtn" hidden>→</button><span id="title"></span></div>
<main id="grid"></main>
<div id="moreBox"></div>

<!-- Login gate (only when Firebase is configured) -->
<section id="gate" hidden>
  <div class="gcard">
    <button class="glang" id="gLang"></button>
    <div class="glogo">▶</div>
    <h1>Tube Kids Family</h1>
    <div data-step="id">
      <p data-i18n="loginIntro"></p>
      <input id="gId" type="text" inputmode="email" autocomplete="username" data-i18n-ph="idPh">
      <button class="btn big" id="gSend" data-i18n="continue"></button>
      <button class="linkbtn" id="gAdmin" data-i18n="loginAdmin"></button>
    </div>
    <div data-step="code" hidden>
      <p id="gCodeMsg"></p>

/* ---------- YouTube Data API ---------- */
async function api(path, params) {
  const key = apiKey();
  if (!key) throw new Error("NO_KEY");
  const r = await fetch("https://www.googleapis.com/youtube/v3/" + path + "?" + new URLSearchParams({ ...params, key }));
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || ("HTTP " + r.status));
  return j;
}
function parseEntry(s) {
  s = String(s).trim(); if (!s) return null;
  let m;
  if ((m = s.match(/(?:[?&]v=|youtu\.be\/|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/))) return { type: "video", id: m[1] };
  if ((m = s.match(/(UC[\w-]{22})/))) return { type: "id", id: m[1] };
  if ((m = s.match(/@([^\/?#\s]+)/))) return { type: "handle", id: "@" + decodeURIComponent(m[1]) };
  return null;
}
const chunk = (a, n) => { const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o; };
async function resolveChannelIds(list) {
  const cache = LS.get("resolved", {});
  const ids = [], vidIds = [], unresolved = [];
  for (const raw of list) {
    const e = parseEntry(raw);
    if (!e) { unresolved.push(raw); continue; }
    const k = e.type + ":" + e.id;
    if (cache[k]) { ids.push(cache[k]); continue; }
    if (e.type === "id") { ids.push(e.id); cache[k] = e.id; }
    else if (e.type === "video") vidIds.push(e.id);
    else {
      try {
        const j = await api("channels", { part: "id", forHandle: e.id });
        if (j.items && j.items[0]) { cache[k] = j.items[0].id; ids.push(j.items[0].id); } else unresolved.push(raw);
      } catch (err) { if (err.message === "NO_KEY") throw err; unresolved.push(raw); }
    }
  }
  for (const part of chunk(vidIds, 50)) {
    const j = await api("videos", { part: "snippet", id: part.join(",") });
    for (const it of j.items || []) { cache["video:" + it.id] = it.snippet.channelId; ids.push(it.snippet.channelId); }
  }
  LS.set("resolved", cache);
  if (unresolved.length) toast(T("notFound")(unresolved.join(" , ")), 6000);
  return [...new Set(ids)];
}
async function loadChannelInfo(ids) {
  const out = [];
  for (const part of chunk(ids, 50)) {
    const j = await api("channels", { part: "snippet,contentDetails", id: part.join(",") });
    for (const it of j.items || []) out.push({ id: it.id, title: it.snippet.title, thumb: thumbOf(it.snippet.thumbnails, ["medium", "default"]), uploads: it.contentDetails.relatedPlaylists.uploads });
  }
  out.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
  return out;
}
function isoDur(s) {
  const m = /P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(s || "") || [];
  return (+m[1] || 0) * 86400 + (+m[2] || 0) * 3600 + (+m[3] || 0) * 60 + (+m[4] || 0);
}
// details for a list of video ids, kept in the same order, only playable videos from allowed channels
async function videoDetails(ids) {
  const allowed = new Set(channels.map(c => c.id)), out = [];
  for (const part of chunk(ids, 50)) {
    const d = await api("videos", { part: "snippet,contentDetails,status", id: part.join(",") });
    out.push(...(d.items || []));
  }
  out.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
  return out
    .filter(v => allowed.has(v.snippet.channelId) && v.status && v.status.embeddable !== false && v.status.privacyStatus !== "private" && (v.snippet.liveBroadcastContent || "none") === "none")

let db = null, auth = null, user = null, myId = "", myRec = null, amAdmin = false, amEditor = false;
let confirmation = null, verifier = null, cfgUnsub = null, gateStep = null, gateArg = null, adminIntent = false, pendingLink = null;
const FB_V = "10.12.2";
const loadScript = u => new Promise((res, rej) => { const s = document.createElement("script"); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
const fbErr = e => T("fb")[e && e.code] || (e && e.message) || String(e);
const isEmail = s => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s);
function normPhone(s) {
  let d = String(s).replace(/[^\d+]/g, "");
  if (d.startsWith("00")) d = "+" + d.slice(2);
  if (!d.startsWith("+")) d = CONFIG.COUNTRY_CODE + d.replace(/^0/, "");
  return /^\+\d{8,15}$/.test(d) ? d : null;
}
const idOf = s => { s = String(s).trim(); return s.includes("@") ? (isEmail(s) ? s.toLowerCase() : null) : normPhone(s); };
const myIds = u => [u && u.email && u.email.toLowerCase(), u && u.phoneNumber].filter(Boolean);
const cleanUrl = () => history.replaceState(history.state, "", location.pathname + location.hash.replace(/^#admin$/, ""));
const FV = () => firebase.firestore.FieldValue;
const tsDate = x => !x ? null : x.toDate ? x.toDate() : new Date(x);
const tsMs = x => { const d = tsDate(x); return d ? d.getTime() : 0; };
const fmtDate = (d, time) => !d ? "" : new Intl.DateTimeFormat(lang === "ar" ? "ar-EG" : "en-GB", time ? { dateStyle: "medium", timeStyle: "short" } : { dateStyle: "medium" }).format(d);
function deviceName() {
  const ua = navigator.userAgent;
  const os = /Android/i.test(ua) ? "Android" : /iPhone|iPad|iPod/i.test(ua) ? "iPhone/iPad" : /Windows/i.test(ua) ? "Windows" : /Mac OS/i.test(ua) ? "Mac" : /CrOS/.test(ua) ? "ChromeOS" : /Linux/i.test(ua) ? "Linux" : "?";
  const br = /Edg\//.test(ua) ? "Edge" : /OPR\//.test(ua) ? "Opera" : /SamsungBrowser/.test(ua) ? "Samsung" : /Firefox/.test(ua) ? "Firefox" : /Chrome\//.test(ua) ? "Chrome" : /Safari/.test(ua) ? "Safari" : "?";
  return os + " · " + br + (standalone ? " · App" : "");
}

function showGate(step, arg) {
  gateStep = step; gateArg = arg;
  $("#gate").hidden = false;
  document.querySelectorAll("#gate [data-step]").forEach(d => d.hidden = d.dataset.step !== step);
  if (step === "code") $("#gCodeMsg").innerHTML = T("codeSent")(esc(arg));
  if (step === "mail") $("#gMailMsg").innerHTML = T("mailSent")(esc(arg));
  if (step === "denied") $("#gDeniedMsg").innerHTML = typeof arg === "function" ? arg() : T("deniedMsg")(esc(arg));
  const f = { id: "#gId", code: "#gCode", confirmEmail: "#gEmail2", admin: "#gAEmail" }[step]; if (f) setTimeout(() => $(f).focus(), 50);
}
function hideGate() { gateStep = null; $("#gate").hidden = true; }

async function initFirebase() {
  showGate("loading");
  const base = `https://www.gstatic.com/firebasejs/${FB_V}/`;
  await loadScript(base + "firebase-app-compat.js");
  await Promise.all([loadScript(base + "firebase-auth-compat.js"), loadScript(base + "firebase-firestore-compat.js")]);
  firebase.initializeApp(CONFIG.FIREBASE);
  db = firebase.firestore(); auth = firebase.auth();
  auth.languageCode = lang;
  if (auth.isSignInWithEmailLink(location.href)) {     // finishing an email-link sign-in that opened this page
    const email = LS.get("emailForSignIn", "");
    if (email) { try { await auth.signInWithEmailLink(email, location.href); LS.del("emailForSignIn"); } catch (e) { toast(fbErr(e), 6000); } cleanUrl(); }
    else { pendingLink = location.href; cleanUrl(); }
  }
  auth.onAuthStateChanged(onAuth);
}
async function onAuth(u) {
  user = u; myRec = null; amAdmin = amEditor = false; myChannels = [];
  if (cfgUnsub) { cfgUnsub(); cfgUnsub = null; }
  if (!u) { authorized = false; myId = ""; showGate(pendingLink ? "confirmEmail" : adminIntent ? "admin" : "id"); render(); return; }
  showGate("loading");
  myId = myIds(u)[0] || "";
  // the user's own record: role, suspended, expiry, channels
  try {
    for (const i of myIds(u)) { const d = await db.collection("users").doc(i).get(); if (d.exists) { myRec = { id: i, ...d.data() }; break; } }
  } catch {}
  if (myRec) {
    if (myRec.disabled) { authorized = false; return showGate("denied", () => T("suspendedMsg")(esc(myId))); }
    const exp = tsDate(myRec.expires);
    if (exp && exp < new Date()) { authorized = false; return showGate("denied", () => T("expiredMsg")(esc(myId), fmtDate(exp))); }
    amAdmin = myRec.role === "admin"; amEditor = amAdmin || myRec.role === "editor";
    myChannels = Array.isArray(myRec.channels) ? myRec.channels : [];
  }
  logActivity(); loadProfile();
  cfgUnsub = db.collection("app").doc("config").onSnapshot(d => {
    const first = !authorized;
    authorized = true; hideGate();
    const before = JSON.stringify([apiKey(), channelList(), opts().showPl]);
    const x = d.exists ? d.data() : null;
    remoteCfg = x ? { apiKey: x.apiKey || "", channels: x.channels || [], hideShorts: !!x.hideShorts, kidLock: (x.kidLock ?? x.shield) !== false, showTv: x.showTv !== false, showPl: x.showPl !== false } : null;
    LS.set("remoteCfg", remoteCfg);
    const changed = JSON.stringify([apiKey(), channelList(), opts().showPl]) !== before;
    if (changed) lastError = "";
    if (first || changed) refresh(changed, true);   // first load respects the refresh interval unless the settings changed
    render();
    if (first && (adminIntent || location.hash === "#admin")) { adminIntent = false; cleanUrl(); openAdmin(); }
    if (first) { checkInstalled(); if (LS.get("installPending", false)) markInstalled(); }
  }, e => {
    authorized = false;
    if (!(e && e.code === "permission-denied")) toast(fbErr(e), 6000);
    showGate("denied", myId);
  });
}
// who signed in, when and from what device (once per app session) + last seen
async function logActivity() {
  if (!db || !myId) return;
  try {
    const ref = db.collection("activity").doc(myId), d = await ref.get();
    const newSession = !sessionStorage.getItem("kt_session_" + myId);
    const data = { lastSeen: FV().serverTimestamp(), lastDevice: deviceName() };
    if (standalone) { data.installedApp = true; data.lastAppOpen = FV().serverTimestamp(); }
    if (!d.exists) data.firstSeen = FV().serverTimestamp();
    if (newSession) data.logins = FV().increment(1);
    await ref.set(data, { merge: true });
    if (newSession) {
      sessionStorage.setItem("kt_session_" + myId, "1");
      await db.collection("logins").add({ id: myId, at: FV().serverTimestamp(), device: deviceName() });
    }
  } catch (e) { console.warn("activity", e); }
}
// the app was installed (or opened as an installed app for the first time) → note it for the admin
function checkInstalled() { if (standalone && !LS.get("installLogged_" + myId, false)) markInstalled(); }
async function markInstalled() {
  if (!REMOTE || !db || !myId) { LS.set("installPending", true); return; }
  try {
    await db.collection("activity").doc(myId).set({ installedApp: true, installedAt: FV().serverTimestamp(), installDevice: deviceName() }, { merge: true });
    await db.collection("logins").add({ id: myId, at: FV().serverTimestamp(), device: deviceName(), type: "install" });
    LS.set("installLogged_" + myId, true); LS.del("installPending");
  } catch (e) { console.warn("install", e); }
}
window.addEventListener("appinstalled", () => markInstalled());
// which video was watched (once each time a video starts)
function logView() {
  const v = playlist[idx];
  if (!REMOTE || !db || !myId || !v || viewLogged === v.id) return;
  viewLogged = v.id;
  db.collection("views").add({ id: myId, v: v.id, title: v.title, ch: chName(v.ch), at: FV().serverTimestamp() }).catch(e => console.warn("view", e));
}

$("#gSend").onclick = async () => {
  const id = idOf($("#gId").value), b = $("#gSend");
  if (!id) return toast(T("badId"));
  b.disabled = true; auth.languageCode = lang;
  try {
    if (id.includes("@")) {
      await auth.sendSignInLinkToEmail(id, { url: location.origin + location.pathname, handleCodeInApp: true });
      LS.set("emailForSignIn", id); showGate("mail", id);
    } else {
      if (!verifier) verifier = new firebase.auth.RecaptchaVerifier("recaptcha", { size: "invisible" });
      confirmation = await auth.signInWithPhoneNumber(id, verifier);
      $("#gCode").value = ""; showGate("code", id);
    }
  } catch (e) {
    toast(fbErr(e), 7000);
    if (verifier) { try { verifier.clear(); } catch {} verifier = null; $("#recaptcha").innerHTML = ""; }
  } finally { b.disabled = false; }
};
$("#gId").addEventListener("keydown", e => { if (e.key === "Enter") $("#gSend").click(); });
$("#gAdmin").onclick = () => { adminIntent = true; showGate("admin"); };
$("#gAOk").onclick = async () => {
  const email = idOf($("#gAEmail").value), pw = $("#gAPass").value, b = $("#gAOk");
  if (!email || !email.includes("@")) return toast(T("badId"));
  b.disabled = true; adminIntent = true;
  try { await auth.signInWithEmailAndPassword(email, pw); $("#gAPass").value = ""; } catch (e) { toast(fbErr(e)); } finally { b.disabled = false; }
};
$("#gAPass").addEventListener("keydown", e => { if (e.key === "Enter") $("#gAOk").click(); });
$("#gAForgot").onclick = async () => {
  const email = idOf($("#gAEmail").value);
  if (!email || !email.includes("@")) return toast(T("emailFirst"));

};

$("#gCode").addEventListener("input", e => { if (e.target.value.replace(/\D/g, "").length === 6) $("#gVerify").click(); });
$("#gPasteOk").onclick = async () => {
  const link = $("#gPaste").value.trim(), email = LS.get("emailForSignIn", "") || gateArg;
  if (!auth.isSignInWithEmailLink(link)) return toast(T("badLink"));

};
$("#gEmail2Ok").onclick = async () => {
  const email = idOf($("#gEmail2").value);
  if (!email || !email.includes("@")) return toast(T("badId"));
  try { await auth.signInWithEmailLink(email, pendingLink); pendingLink = null; LS.del("emailForSignIn"); } catch (e) { toast(fbErr(e), 6000); pendingLink = null; showGate("id"); }
};
document.querySelectorAll("#gate [data-back]").forEach(b => b.onclick = () => { adminIntent = false; showGate("id"); });
$("#gRetry").onclick = () => onAuth(user);
async function signOut(thenAdmin) {
  if (P.classList.contains("open")) closePlayer(true);
  document.querySelectorAll(".modal.open").forEach(m => m.classList.remove("open"));
  try { sessionStorage.removeItem("kt_session_" + myId); } catch {}
  try { await auth.signOut(); } catch {}
  remoteCfg = null; LS.del("remoteCfg"); $("#gId").value = ""; profile = { name: "", photo: "" }; LS.del("profile"); paintAvatar();
  if (thenAdmin) { adminIntent = true; showGate("admin"); } else toast(T("loggedOut"));
}
$("#gLogout").onclick = () => signOut(); $("#accLogout").onclick = () => signOut();

/* ---------- profile (👤): name, photo and account info ---------- */
// photo is resized to a small JPEG and kept in Firestore (profiles/{id}) — no Firebase Storage needed.
// Without Firebase it stays on this device.
let profile = LS.get("profile", { name: "", photo: "" });
let draftPhoto = null;
function avatarInner(p, fallback) {
  if (p.photo) return `<img src="${esc(p.photo)}" alt="">`;
  const ch = (p.name || "").trim().charAt(0);
  return ch ? `<span class="ini">${esc(ch.toUpperCase())}</span>` : fallback;
}
function paintAvatar() { $("#accountBtn").innerHTML = avatarInner(profile, "👤"); }
async function loadProfile() {
  if (REMOTE && db && myId) {
    try {
      const d = await db.collection("profiles").doc(myId).get();
      profile = d.exists ? { name: d.data().name || "", photo: d.data().photo || "" } : { name: "", photo: "" };
      LS.set("profile", profile);
    } catch {}
  }
  paintAvatar();
}
function resizeImage(file, size = 192) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = c.height = size;
      const s = Math.min(img.width, img.height);
      c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("image")); };
    img.src = url;
  });
}
const paintDraft = () => { $("#pAvImg").innerHTML = avatarInner({ name: $("#pName").value, photo: draftPhoto }, "👤"); $("#pRemovePhoto").hidden = !draftPhoto; };
const infoRow = (k, v) => v ? `<div><span>${k}</span><b dir="auto">${esc(v)}</b></div>` : "";
$("#accountBtn").onclick = async () => {
  draftPhoto = profile.photo || "";
  $("#pName").value = profile.name || "";
  paintDraft();
  $("#accId").textContent = REMOTE ? myId : "";
  $("#accSettings").hidden = !(REMOTE && amEditor);
  $("#accAdmin").hidden = REMOTE && amEditor;
  $("#accLogout").hidden = !REMOTE;
  $("#pNote").textContent = REMOTE ? "" : T("localNote");
  const base = infoRow(T("lDevice"), deviceName()) + infoRow(T("lWatched"), String(watched.size)) + infoRow(T("lLang"), lang === "ar" ? "العربية" : "English");
  $("#pInfo").innerHTML = (REMOTE && myRec ? infoRow(T("lRole"), T("roles")[myRec.role || "viewer"]) : "") + base;
  openModal("#accountModal");
  if (REMOTE && db && myId) {
    try {
      const a = (await db.collection("activity").doc(myId).get()).data() || {};
      $("#pInfo").innerHTML = (myRec ? infoRow(T("lRole"), T("roles")[myRec.role || "viewer"]) : "")
        + infoRow(T("lFirst"), fmtDate(tsDate(a.firstSeen), true)) + infoRow(T("lLast"), fmtDate(tsDate(a.lastSeen), true))
        + infoRow(T("lLogins"), a.logins ? String(a.logins) : "") + base;
    } catch {}
  }
};
$("#pAv").onclick = () => $("#pFile").click();
$("#pFile").onchange = async e => {

$("#pRemovePhoto").onclick = () => { draftPhoto = ""; paintDraft(); };

paintAvatar();
$("#accSettings").onclick = () => { $("#accountModal").classList.remove("open"); openSettings(); };
$("#accAdmin").onclick = () => { $("#accountModal").classList.remove("open"); if (REMOTE) signOut(true); else openAdmin(); };

const ROLES = ["viewer", "editor", "admin"];
const roleOptions = sel => `${ROLES.map(r => `<option value="${r}" ${r === sel ? "selected" : ""}>${T("roles")[r]}</option>`).join("")}`;

/* users = people added by an admin (users/{id}) + people who signed in (activity/{id}) */
let usersCache = [];
async function loadUsers() {
  const box = $("#usersList"); box.textContent = "...";
  try {
    const [us, act, prof] = await Promise.all([db.collection("users").get(), db.collection("activity").get(), db.collection("profiles").get().catch(() => ({ docs: [] }))]);
    const map = new Map();
    us.docs.forEach(d => map.set(d.id, { id: d.id, rec: d.data() }));
    act.docs.forEach(d => { const e = map.get(d.id) || { id: d.id }; e.act = d.data(); map.set(d.id, e); });
    prof.docs.forEach(d => { const e = map.get(d.id); if (e) e.prof = d.data(); });
    usersCache = [...map.values()].sort((a, b) => tsMs(b.act && b.act.lastSeen) - tsMs(a.act && a.act.lastSeen));
    renderUsers();
    const start = new Date(); start.setHours(0, 0, 0, 0);
    let viewsToday = "–";
    try { const v = await db.collection("views").orderBy("at", "desc").limit(1000).get(); viewsToday = v.docs.filter(d => tsMs(d.data().at) >= start.getTime()).length; } catch {}
    const st = [[usersCache.length, T("stUsers")], [usersCache.filter(e => tsMs(e.act && e.act.lastSeen) >= start.getTime()).length, T("stToday")], [usersCache.filter(e => e.act && e.act.installedApp).length, T("stApp")], [viewsToday, T("stViews")]];
    $("#uStats").innerHTML = st.map(([n, l]) => `<div><b>${n}</b><span>${l}</span></div>`).join("");
  } catch (e) { box.textContent = fbErr(e); }
}
function userStatus(e) {
  if (!e.rec) return ["notAdded", T("notAdded")];
  if (e.rec.disabled) return ["off", T("suspended")];
  const x = tsDate(e.rec.expires);
  if (x && x < new Date()) return ["off", T("expired")];
  return ["ok", x ? T("until")(fmtDate(x)) : T("active")];
}
function renderUsers() {
  const f = $("#uFilter").value.trim().toLowerCase();
  $("#usersList").innerHTML = usersCache.filter(e => !f || e.id.includes(f)).map(e => {
    const a = e.act || {};
    const [cls, st] = userStatus(e), role = e.rec ? (e.rec.role || "viewer") : "";
    const seen = a.lastSeen ? T("lastSeen")(fmtDate(tsDate(a.lastSeen), true)) : T("never");
    return `<button class="urow" data-uid="${esc(e.id)}">
      <span class="uid">${e.prof && e.prof.photo ? `<img class="uav" src="${esc(e.prof.photo)}" alt="">` : ""}${e.prof && e.prof.name ? `<b>${esc(e.prof.name)}</b> · ` : ""}<span dir="ltr">${esc(e.id)}</span>${e.id === myId ? " " + T("you") : ""}</span>
      <span class="tags">${role ? `<span class="tag role-${role}">${T("roles")[role]}</span>` : ""}<span class="tag ${cls}">${st}</span>${a.installedApp ? `<span class="tag app">${T("installedTag")}</span>` : ""}${e.rec && e.rec.channels && e.rec.channels.length ? `<span class="tag">📺 ${e.rec.channels.length}</span>` : ""}</span>
      <span class="useen">${seen}${a.logins ? " · " + T("timesN")(a.logins) : ""}${a.lastDevice ? " · " + esc(a.lastDevice) : ""}</span>
    </button>`;
  }).join("") || T("none");
}
$("#uFilter").addEventListener("input", renderUsers);
$("#usersList").addEventListener("click", e => { const b = e.target.closest("[data-uid]"); if (b) openUser(b.dataset.uid); });
$("#uAdd").onclick = async () => {
  const id = idOf($("#uNew").value), pw = $("#uPass").value; if (!id) return toast(T("badId"));
  try {
    if (pw) {   // create a password account on a second Firebase instance so the admin stays signed in
      if (!id.includes("@")) return toast(T("emailOnly"));
      const sec = firebase.apps.find(a => a.name === "sec") || firebase.initializeApp(CONFIG.FIREBASE, "sec");
      try { await sec.auth().createUserWithEmailAndPassword(id, pw); } catch (e) { if (e.code === "auth/email-already-in-use") toast(T("accountExists"), 6000); else throw e; }
      try { await sec.auth().signOut(); } catch {}
      $("#uPass").value = "";
    }
    await db.collection("users").doc(id).set({ role: $("#uNewRole").value, addedBy: myId, at: FV().serverTimestamp() }, { merge: true });
    $("#uNew").value = ""; toast(T("added")(id)); loadUsers();
  } catch (e) { toast(fbErr(e)); }
};

let editing = null;
function openUser(id) {
  const e = usersCache.find(x => x.id === id) || { id };
  const r = e.rec || {}, a = e.act || {};
  editing = id;
  $("#ueTitle").textContent = (e.prof && e.prof.name ? e.prof.name + " · " : "") + id;
  $("#ueStats").innerHTML = [a.firstSeen && T("firstSeen")(fmtDate(tsDate(a.firstSeen), true)), a.lastSeen ? T("lastSeen")(fmtDate(tsDate(a.lastSeen), true)) : T("never"), a.logins && T("timesN")(a.logins), a.lastDevice && T("device")(esc(a.lastDevice))].filter(Boolean).join("<br>");
  $("#ueRole").innerHTML = roleOptions(r.role || "viewer");
  $("#ueDisabled").checked = !!r.disabled;
  const x = tsDate(r.expires);
  $("#ueExpires").value = x ? new Date(x.getTime() - x.getTimezoneOffset() * 6e4).toISOString().slice(0, 10) : "";
  const sel = Array.isArray(r.channels) ? r.channels : [];
  $("#ueChannels").innerHTML = channels.map(c => `<label><input type="checkbox" value="${esc(c.id)}" ${!sel.length || sel.includes(c.id) ? "checked" : ""}><img src="${esc(c.thumb)}" alt="">${esc(c.title)}</label>`).join("");
  $("#ueDelete").hidden = !e.rec || id === myId;
  $("#ueReset").hidden = !id.includes("@");
  openModal("#userModal");
}
$("#ueReset").onclick = async () => { try { await auth.sendPasswordResetEmail(editing); toast(T("resetSentTo")(editing), 5000); } catch (e) { toast(fbErr(e)); } };
$("#ueNoExp").onclick = () => { $("#ueExpires").value = ""; };
$("#ueSave").onclick = async () => {
  const role = $("#ueRole").value, disabled = $("#ueDisabled").checked;
  if (editing === myId && (role !== "admin" || disabled)) return toast(T("selfLock"), 5000);
  const ticked = [...document.querySelectorAll("#ueChannels input:checked")].map(i => i.value);
  const exp = $("#ueExpires").value;
  const data = {
    role, disabled,
    expires: exp ? firebase.firestore.Timestamp.fromDate(new Date(exp + "T23:59:59")) : null,
    channels: ticked.length === channels.length ? [] : ticked,
    updatedBy: myId, updatedAt: FV().serverTimestamp()
  };
  try { await db.collection("users").doc(editing).set(data, { merge: true }); toast(T("userSaved")); $("#userModal").classList.remove("open"); loadUsers(); }
  catch (e) { toast(fbErr(e)); }
};
$("#ueDelete").onclick = async e => {
  if (!confirmTwice(e.currentTarget)) return;
  try { await db.collection("users").doc(editing).delete(); toast(T("deleted")(editing)); $("#userModal").classList.remove("open"); loadUsers(); }
  catch (err) { toast(fbErr(err)); }
};
function confirmTwice(btn) {   // tap once → "Sure?", tap again within 3s → do it
  if (btn.dataset.sure) return true;
  btn.dataset.sure = 1; const t = btn.textContent; btn.textContent = T("sure");
  setTimeout(() => { delete btn.dataset.sure; btn.textContent = t; }, 3000);
  return false;
}

/* activity: sign-ins and watched videos */
let logKind = "logins", logCache = [];
async function loadLogs() {
  const box = $("#logList"); box.textContent = "...";
  try { const s = await db.collection(logKind).orderBy("at", "desc").limit(300).get(); logCache = s.docs.map(d => d.data()); renderLogs(); }
  catch (e) { box.textContent = fbErr(e); }
}
function renderLogs() {
  const f = $("#logFilter").value.trim().toLowerCase();
  const rows = logCache.filter(x => !f || (x.id || "").toLowerCase().includes(f) || (x.title || "").toLowerCase().includes(f) || (x.ch || "").toLowerCase().includes(f));
  $("#logList").innerHTML = rows.map(x => `<div class="lrow"><span class="uid" dir="ltr" data-f="${esc(x.id)}">${esc(x.id)}</span><span class="ltime">${fmtDate(tsDate(x.at), true)}</span><span class="ldet" dir="auto">${logKind === "logins" ? (x.type === "install" ? T("installedEvt") + " · " : "📱 ") + esc(x.device || "") : "▶ " + esc(x.title || x.v) + (x.ch ? " · " + esc(x.ch) : "")}</span></div>`).join("") || T("noLogs");
}
$("#logTabs").addEventListener("click", e => { const b = e.target.closest("[data-log]"); if (!b) return; logKind = b.dataset.log; document.querySelectorAll("#logTabs button").forEach(x => x.classList.toggle("on", x === b)); loadLogs(); });
$("#logFilter").addEventListener("input", renderLogs);
$("#logList").addEventListener("click", e => { const f = e.target.dataset && e.target.dataset.f; if (f) { $("#logFilter").value = f; renderLogs(); } });
$("#logReload").onclick = loadLogs;

$("#sSave").onclick = async () => {
  const data = {
    apiKey: $("#sKey").value.replace(/[\s"']/g, ""),
    channels: $("#sCh").value.split(/\n+/).map(x => x.trim()).filter(Boolean),
    hideShorts: $("#sShorts").checked, kidLock: $("#sKid").checked, showTv: $("#sTv").checked, showPl: $("#sPl").checked
  };
  const b = $("#sSave"); b.disabled = true;
  try {
    if (REMOTE) {
      await db.collection("app").doc("config").set({ ...data, updatedBy: myId, updatedAt: FV().serverTimestamp() });
      toast(T("saved"));
    } else {
      data.apiKey && data.apiKey !== CONFIG.API_KEY ? LS.set("apiKey", data.apiKey) : LS.del("apiKey");
      data.channels.join("\n") === CONFIG.CHANNELS.join("\n") ? LS.del("channels") : LS.set("channels", data.channels);
      LS.set("opts", { hideShorts: data.hideShorts, kidLock: data.kidLock, showTv: data.showTv, showPl: data.showPl });
      const np = $("#sPin").value.trim(); if (np) LS.set("pin", np);
      lastError = ""; refresh(true); toast(T("savedLocal"));
    }
    $("#setModal").classList.remove("open"); current = "all"; render();
  } catch (e) { toast(fbErr(e)); }
  finally { b.disabled = false; }
};
$("#sDefaults").onclick = () => { $("#sCh").value = CONFIG.CHANNELS.join("\n"); };
$("#sClear").onclick = () => { ["vids", "chInfo", "lastFetch", "resolved", "pls"].forEach(LS.del); vids = {}; channels = []; pls = {}; plVids = {}; lastFetch = 0; toast(T("cacheCleared")); $("#setModal").classList.remove("open"); refresh(true, true); };

/* ---------- watch timer: limit watching time, then lock the app until a parent enters the PIN ---------- */
// counted only while a video is actually playing; stored on this device
const TIMER_CHOICES = [15, 30, 45, 60, 90, 120];
const today = () => new Date().toLocaleDateString("en-CA");
const getTimer = () => LS.get("timer", { active: false });
const saveTimer = t => LS.set("timer", t);
const timeLeft = t => Math.max(0, t.limit * 60 + (t.extra || 0) - (t.used || 0));
const fmtLeft = s => { s = Math.ceil(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${String(m).padStart(2, "0")}:${String(x).padStart(2, "0")}` : `${m}:${String(x).padStart(2, "0")}`; };
function rollDay(t) { if (t.active && t.daily && t.day !== today()) { t.day = today(); t.used = 0; t.extra = 0; saveTimer(t); hideLock(); } }
let tmPick = 30;
function paintTimer() {
  const t = getTimer();
  $("#timerPill").hidden = !t.active;
  if (t.active) { const l = timeLeft(t); $("#timerLeft").textContent = fmtLeft(l); $("#timerPill").classList.toggle("low", l < 120); }
}
function openTimer() {
  const t = getTimer(); rollDay(t);
  $("#tmSetup").hidden = !!t.active; $("#tmActive").hidden = !t.active;
  if (t.active) {
    $("#tmLeft").textContent = fmtLeft(timeLeft(t));
    $("#tmDesc").textContent = (t.daily ? T("tmDailyDesc") : T("tmOnceDesc"))(t.limit);
    $("#tmPin2").value = "";
  } else {
    $("#tmChips").innerHTML = TIMER_CHOICES.map(m => `<button type="button" data-min="${m}" class="${m === tmPick ? "on" : ""}">${T("minN")(m)}</button>`).join("");
    $("#tmCustom").value = ""; $("#tmPin").value = "";
  }
  openModal("#timerModal");
}
$("#tmChips").addEventListener("click", e => { const b = e.target.closest("[data-min]"); if (!b) return; tmPick = +b.dataset.min; $("#tmCustom").value = ""; document.querySelectorAll("#tmChips button").forEach(x => x.classList.toggle("on", x === b)); });
$("#tmStart").onclick = () => {
  const mins = +$("#tmCustom").value || tmPick, pinv = $("#tmPin").value.trim();
  if (!(mins > 0 && mins <= 720)) return toast(T("tmBadMin"));
  if (!/^\d{4,8}$/.test(pinv)) return toast(T("tmBadPin"));
  saveTimer({ active: true, limit: mins, used: 0, extra: 0, daily: $("#tmDaily").checked, day: today(), pin: pinv });
  $("#timerModal").classList.remove("open"); paintTimer(); toast(T("tmStarted")(mins));
};
function checkTimerPin(input) {
  const t = getTimer();
  if ($(input).value.trim() !== t.pin) { toast(T("wrongPin")); $(input).value = ""; return null; }
  return t;
}
function addTime(input) { const t = checkTimerPin(input); if (!t) return; t.extra = (t.extra || 0) + 15 * 60; saveTimer(t); hideLock(); $("#timerModal").classList.remove("open"); paintTimer(); toast(T("tmAdded")); }
function stopTimer(input) { const t = checkTimerPin(input); if (!t) return; saveTimer({ active: false }); hideLock(); $("#timerModal").classList.remove("open"); paintTimer(); toast(T("tmStopped")); }
$("#tmAdd").onclick = () => addTime("#tmPin2"); $("#tmStop").onclick = () => stopTimer("#tmPin2");
$("#lockAdd").onclick = () => addTime("#lockPin"); $("#lockStop").onclick = () => stopTimer("#lockPin");
$("#timerPill").onclick = openTimer;
$("#accTimer").onclick = () => { $("#accountModal").classList.remove("open"); openTimer(); };
function showLock() {
  if (!$("#lock").hidden) return;
  if (P.classList.contains("open")) closePlayer(true);
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  document.querySelectorAll(".modal.open").forEach(m => m.classList.remove("open"));
  const t = getTimer();
  $("#lockMsg").textContent = t.daily ? T("lockDaily") : T("lockOnce");
  $("#lockPin").value = ""; $("#lock").hidden = false;
}
function hideLock() { $("#lock").hidden = true; }
let tmLast = Date.now();
setInterval(() => {
  const now = Date.now(), dt = (now - tmLast) / 1000; tmLast = now;
  const t = getTimer(); if (!t.active) { paintTimer(); return; }
  rollDay(t);
  let playing = false;
  try { playing = P.classList.contains("open") && ytReady && yt.getPlayerState() === YT.PlayerState.PLAYING; } catch {}
  if (playing && dt < 5) { t.used = (t.used || 0) + dt; saveTimer(t); }
  paintTimer();
  if (timeLeft(t) <= 0) showLock();
}, 1000);
(() => { const t = getTimer(); rollDay(t); paintTimer(); if (t.active && timeLeft(t) <= 0) showLock(); })();

/* ---------- boot ---------- */
applyLang();
render();
if (REMOTE) initFirebase().catch(e => { console.warn(e); toast(T("fbDown"), 6000); });
else { refresh(false); if (location.hash === "#admin") { cleanUrl(); openAdmin(); } }
setInterval(() => { if (document.visibilityState === "visible") refresh(false); }, 5 * 60e3);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(false); });
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
