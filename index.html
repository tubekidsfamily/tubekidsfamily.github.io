<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2f77">

<title>Tube Kids Family</title>
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<script>
/* =====================================================================

   ===================================================================== */
const CONFIG = {
  // مفتاح YouTube Data API v3 (ممكن تحطه هنا أو من شاشة الإعدادات جوه الأبلكيشن)
  API_KEY: "AIzaSyBookLb_X2ALPYj3Ww7DBHl5-smpdnwmgg",
  // رقم سري لشاشة الإعدادات — بيستخدم بس لو FIREBASE فاضي

<style>
:root{--bg:#f3f5ff;--card:#fff;--ink:#1d2140;--muted:#6b7090;--brand:#2b2f77;--accent:#ff5a5f;--yellow:#ffc93c;--radius:18px;--pbg:#14152b;--pbtn:#262a52}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
button{font-family:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 3px 12px rgba(0,0,0,.15)}
header h1{font-size:20px;margin:0;flex:1;font-weight:800;display:flex;align-items:center;gap:8px;white-space:nowrap}
header h1 .logo{width:32px;height:32px;border-radius:9px;background:var(--yellow);display:grid;place-items:center;color:var(--brand);font-size:16px}
.icon-btn{background:rgba(255,255,255,.15);border:0;color:#fff;min-width:42px;height:42px;border-radius:12px;font-size:20px;display:grid;place-items:center;padding:0 8px}
.icon-btn.txt{font-size:15px;font-weight:800}
.icon-btn:active{transform:scale(.93)}
.icon-btn.spin span{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#search{width:100%;max-width:260px;border:0;border-radius:12px;padding:9px 12px;font-family:inherit;font-size:15px}
@media(max-width:600px){#search{display:none}#search.show{display:block;position:absolute;top:100%;left:8px;right:8px;max-width:none;margin-top:6px;box-shadow:0 4px 14px rgba(0,0,0,.2)}header h1 span+span{font-size:17px}}
@media(min-width:601px){#searchToggle{display:none}}
#channels{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;padding:14px;scrollbar-width:none}
#channels::-webkit-scrollbar{display:none}
.ch{flex:0 0 auto;width:84px;text-align:center;background:none;border:0;padding:0;color:var(--ink)}
.ch .av{position:relative;width:72px;height:72px;margin:0 auto;border-radius:50%;background:#dde1ff center/cover;border:4px solid transparent;box-shadow:0 3px 10px rgba(0,0,0,.12);display:grid;place-items:center;font-size:28px}
.ch.active .av{border-color:var(--accent)}
.ch .nm{font-size:12px;font-weight:700;margin-top:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{position:absolute;top:-4px;inset-inline-start:-4px;background:var(--accent);color:#fff;font-size:12px;font-weight:800;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;padding:0 6px;border:2px solid #fff}
#title{padding:0 16px;margin:4px 0 10px;font-size:18px;font-weight:800}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:0 14px 24px}
@media(max-width:560px){#grid{grid-template-columns:1fr 1fr;gap:10px;padding:0 10px 20px}}
@media(max-width:360px){#grid{grid-template-columns:1fr}}
.v{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:0 3px 12px rgba(30,40,120,.08);border:0;padding:0;text-align:start;color:var(--ink);display:flex;flex-direction:column}
.v:active{transform:scale(.97)}
.v .th{position:relative;aspect-ratio:16/9;background:#ccd center/cover}
.v .dur{position:absolute;bottom:6px;inset-inline-end:6px;background:rgba(0,0,0,.78);color:#fff;font-size:12px;padding:1px 6px;border-radius:6px;direction:ltr}
.v .new{position:absolute;top:6px;inset-inline-start:6px;background:var(--accent);color:#fff;font-size:12px;font-weight:800;padding:2px 8px;border-radius:8px}
.v .watched{position:absolute;bottom:0;right:0;left:0;height:4px;background:var(--accent)}
.v .meta{padding:8px 10px 10px}
.v .t{font-size:14px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.v .c{font-size:12px;color:var(--muted);margin-top:4px}
.more{display:block;margin:0 auto 30px;background:var(--brand);color:#fff;border:0;border-radius:14px;padding:12px 26px;font-size:16px;font-weight:700}
.msg{margin:30px 16px;padding:22px;background:#fff;border-radius:var(--radius);text-align:center;line-height:1.8}
.msg b{color:var(--brand)}
.skel{background:linear-gradient(90deg,#e6e8f5 25%,#f2f3fb 50%,#e6e8f5 75%);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- Player ---------- */
#player{position:fixed;inset:0;z-index:50;background:#000;display:none;flex-direction:column;color:#fff}
#player.open{display:flex}
#pTop{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--pbg);z-index:6;transition:opacity .25s}
#pTop .t{flex:1;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{position:relative;flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center;background:#000}
#frameBox{position:relative;width:min(100cqw, calc(100cqh * 16 / 9));aspect-ratio:16/9}
#frameBox iframe,#ytp{position:absolute;inset:0;width:100%;height:100%;border:0}
#tap{position:absolute;inset:0;z-index:3;display:none}
#player.kid #tap{display:block}
#bigIcon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);width:84px;height:84px;border-radius:50%;background:rgba(20,21,43,.75);display:grid;place-items:center;font-size:36px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:4}
#bigIcon.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#pErr{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px;background:#111;z-index:5}
#pErr.show{display:flex}
#bar{background:var(--pbg);padding:6px 12px calc(env(safe-area-inset-bottom) + 10px);z-index:6;transition:opacity .25s}
.seekRow{display:flex;align-items:center;gap:10px;direction:ltr;font-size:13px;font-variant-numeric:tabular-nums;color:#c9cbe8}
#seek{flex:1;accent-color:var(--accent);height:22px}
.ctrls{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:4px}
.ctrls .side{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media(max-width:700px){.ctrls,.ctrls .side{justify-content:center;width:100%}}
.pb{position:relative;background:var(--pbtn);color:#fff;border:0;border-radius:14px;min-width:46px;height:46px;font-size:19px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800}
.pb:active{transform:scale(.93)}
.pb.main{background:var(--accent);min-width:58px;height:52px;font-size:22px}
.pb.small{font-size:14px}
.pb.on{background:var(--yellow);color:var(--ink)}
.pb.tv{background:var(--yellow);color:var(--ink);font-size:15px}
.pb svg{width:22px;height:22px;fill:currentColor}
.grp{display:flex;align-items:center;gap:6px;background:#1d1f3d;border-radius:16px;padding:4px}
#vol{width:96px;accent-color:var(--accent);direction:ltr}
.menu{position:absolute;bottom:56px;inset-inline-start:0;background:#fff;color:var(--ink);border-radius:14px;padding:6px;display:none;flex-direction:column;min-width:96px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:10}
.menu.open{display:flex}
.menu button{border:0;background:none;padding:9px 12px;border-radius:10px;font-weight:700;font-size:15px;text-align:start;color:var(--ink)}
.menu button.sel{background:var(--accent);color:#fff}
/* fullscreen: controls float over the video and hide while playing */
#player.fs #pTop{position:absolute;top:0;left:0;right:0;background:linear-gradient(rgba(0,0,0,.7),transparent)}
#player.fs #bar{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.8))}
#player.fs #stage{position:absolute;inset:0}
#player.fs.idle #pTop,#player.fs.idle #bar{opacity:0;pointer-events:none}
#player.fake-fs{z-index:100}

/* ---------- Modals ---------- */
.modal{position:fixed;inset:0;z-index:120;background:rgba(10,12,40,.55);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.sheet{background:#fff;color:var(--ink);border-radius:22px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px}
.sheet h2{margin:0 0 12px;font-size:20px}
.sheet p{line-height:1.8;margin:0}
.sheet label{display:block;font-weight:700;margin:14px 0 6px}
.sheet input[type=text],.sheet input[type=password],.sheet textarea{width:100%;border:2px solid #dfe2f5;border-radius:12px;padding:10px;font-family:inherit;font-size:15px;direction:ltr;text-align:left}
.sheet textarea{min-height:200px;font-size:13px}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-size:15px;font-weight:700;background:var(--brand);color:#fff}
.btn.ghost{background:#eef0ff;color:var(--brand)}
.btn.red{background:#ffe5e6;color:#c22}
.btn.yellow{background:var(--yellow);color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.7}
.check{display:flex;align-items:flex-start;gap:8px;font-weight:700;margin-top:14px}
.check input{width:20px;height:20px;flex:0 0 auto;margin-top:3px}
.check small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.pin{display:flex;gap:10px;justify-content:center;margin:14px 0}
.pin input{width:200px;text-align:center;font-size:26px;letter-spacing:10px;border:2px solid #dfe2f5;border-radius:12px;padding:8px}
.add-admin{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.add-admin input{flex:1 1 180px;border:2px solid #dfe2f5;border-radius:12px;padding:10px;font-family:inherit;font-size:15px;direction:ltr;text-align:left}
.adm{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:#f4f5ff;border-radius:10px;margin-top:6px;direction:ltr;font-size:14px;color:var(--ink)}
.adm button{border:0;background:#ffe5e6;color:#c22;border-radius:8px;padding:4px 10px;font-family:inherit;font-weight:700}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2140;color:#fff;padding:10px 18px;border-radius:12px;z-index:200;display:none;font-size:14px;max-width:90vw;text-align:center}
</style>
</head>
<body>
<header>
  <h1><span class="logo">▶</span><span>Tube Kids Family</span></h1>
  <input id="search" type="search" data-i18n-ph="search">
  <button class="icon-btn" id="searchToggle" data-i18n-title="searchT">🔍</button>
  <button class="icon-btn txt" id="langBtn"></button>
  <button class="icon-btn" id="refreshBtn" data-i18n-title="refreshT"><span>⟳</span></button>
  <button class="icon-btn" id="settingsBtn" data-i18n-title="settings">🔒</button>
</header>

<nav id="channels"></nav>
<div id="title"></div>
<main id="grid"></main>
<div id="moreBox"></div>

<!-- Player -->
<section id="player" aria-hidden="true">
  <div id="pTop">
    <button class="pb" id="pClose" data-i18n-title="close">✕</button>
    <div class="t" id="pTitle"></div>
  </div>
  <div id="stage">
    <div id="frameBox">
      <div id="ytp"></div>
      <div id="tap"></div>
      <div id="bigIcon">▶</div>
      <div id="pErr">
        <div id="pErrMsg"></div>
        <button class="btn yellow" id="pErrNext" data-i18n="nextVideo"></button>
      </div>
    </div>
  </div>
  <div id="bar">
    <div class="seekRow"><span id="tCur">0:00</span><input type="range" id="seek" min="0" max="100" step="0.1" value="0"><span id="tDur">0:00</span></div>
    <div class="ctrls">
      <div class="side" dir="ltr">
        <button class="pb" id="pPrev" data-i18n-title="prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
        <button class="pb small" id="pBack" data-i18n-title="back10">−10</button>
        <button class="pb main" id="pPlay" data-i18n-title="playPause"><svg viewBox="0 0 24 24" id="playIco"><path d="M8 5v14l11-7z"/></svg></button>
        <button class="pb small" id="pFwd" data-i18n-title="fwd10">+10</button>
        <button class="pb" id="pNext" data-i18n-title="next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
      </div>
      <div class="side">
        <div style="position:relative">
          <button class="pb small" id="pSpeed" data-i18n-title="speed">1x</button>
          <div class="menu" id="speedMenu"></div>
        </div>
        <div class="grp">
          <button class="pb" id="pMute" data-i18n-title="mute">🔊</button>
          <input type="range" id="vol" min="0" max="100" value="100">
        </div>
        <button class="pb small" id="pCC" data-i18n-title="cc">CC</button>
        <button class="pb" id="pFs" data-i18n-title="fullscreen"><svg viewBox="0 0 24 24" id="fsIco"><path d="M5 5h5V3H3v7h2zm9-2v2h5v5h2V3zm5 16h-5v2h7v-7h-2zM5 14H3v7h7v-2H5z"/></svg></button>
        <button class="pb tv" id="pTv">📺 <span data-i18n="tv"></span></button>
      </div>
    </div>
  </div>
</section>

<!-- TV -->
<div class="modal" id="tvModal">
  <div class="sheet" style="max-width:460px">
    <h2 data-i18n="tvTitle"></h2>
    <p data-i18n-html="tvBody"></p>
    <div class="row">
      <button class="btn yellow" id="tvGo" data-i18n="tvGo"></button>
      <button class="btn ghost" data-close data-i18n="cancel"></button>
    </div>
  </div>
</div>

<!-- Admin login (Firebase) -->
<div class="modal" id="loginModal">
  <div class="sheet" style="max-width:400px">
    <h2 data-i18n="adminLogin"></h2>
    <label for="lEmail" data-i18n="email"></label>
    <input id="lEmail" type="text" inputmode="email" autocomplete="username">
    <label for="lPass" data-i18n="password"></label>
    <input id="lPass" type="password" autocomplete="current-password">
    <div class="row">
      <button class="btn" id="lOk" data-i18n="signIn"></button>
      <button class="btn ghost" data-close data-i18n="cancel"></button>
      <button class="btn ghost" id="lForgot" data-i18n="forgot"></button>
    </div>
  </div>
</div>

<!-- PIN (no Firebase) -->
<div class="modal" id="pinModal">
  <div class="sheet" style="max-width:360px;text-align:center">
    <h2 data-i18n="adultsOnly"></h2>
    <div class="hint" data-i18n="enterPin"></div>
    <div class="pin"><input id="pinInput" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></div>
    <div class="row" style="justify-content:center">
      <button class="btn" id="pinOk" data-i18n="signIn"></button>
      <button class="btn ghost" data-close data-i18n="cancel"></button>
    </div>
  </div>
</div>

<!-- Settings -->
<div class="modal" id="setModal">
  <div class="sheet">
    <h2 data-i18n="settings"></h2>
    <label for="sKey" data-i18n="apiKey"></label>
    <input id="sKey" type="text" placeholder="AIza..." autocomplete="off">
    <div class="hint" id="keyHint"></div>
    <label for="sCh" data-i18n="channels"></label>
    <textarea id="sCh" spellcheck="false"></textarea>
    <div class="hint" data-i18n="channelsHint"></div>
    <label class="check"><input type="checkbox" id="sKid"><span><span data-i18n="kidLock"></span><small data-i18n="kidLockHint"></small></span></label>
    <label class="check"><input type="checkbox" id="sTv"><span><span data-i18n="showTv"></span><small data-i18n="showTvHint"></small></span></label>
    <label class="check"><input type="checkbox" id="sShorts"><span data-i18n="hideShorts"></span></label>
    <div id="pinBox">
      <label for="sPin" data-i18n="newPin"></label>
      <input id="sPin" type="password" inputmode="numeric" maxlength="8" data-i18n-ph="newPinPh">
    </div>
    <div id="adminsBox" style="display:none">
      <label data-i18n="admins"></label>
      <div id="adminsList" class="hint">...</div>
      <div class="add-admin">
        <input id="aEmail" type="text" inputmode="email" data-i18n-ph="newAdminEmail">
        <input id="aPass" type="password" data-i18n-ph="newAdminPass">
        <button class="btn" id="aAdd" data-i18n="addAdmin"></button>
      </div>
      <div class="hint" data-i18n="adminHint"></div>
      <div class="hint" id="whoami" style="margin-top:8px"></div>
    </div>
    <div class="row">
      <button class="btn" id="sSave" data-i18n="save"></button>
      <button class="btn ghost" data-close data-i18n="cancel"></button>
      <button class="btn ghost" id="sDefaults" data-i18n="defaults"></button>
      <button class="btn red" id="sClear" data-i18n="clearCache"></button>
      <button class="btn red" id="sLogout" style="display:none" data-i18n="logout"></button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(() => {
"use strict";
/* ---------- storage ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem("kt_" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("kt_" + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem("kt_" + k); } catch {} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const toast = (m, ms = 3000) => { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = "none", ms); };

/* ---------- language ---------- */
const I18N = {
  ar: {
    search: "بحث في الفيديوهات...", searchT: "بحث", refreshT: "تحديث", settings: "الإعدادات", langT: "English", langBtn: "EN",
    all: "الكل", latest: "أحدث الفيديوهات", results: "نتائج البحث", newTag: "جديد", older: "فيديوهات أقدم", loading: "بيحمّل...",
    noVideos: "مفيش فيديوهات هنا.", noMatch: "مفيش فيديوهات بالكلمة دي.",

/* ---------- YouTube Data API ---------- */
async function api(path, params) {
  const key = apiKey();
  if (!key) throw new Error("NO_KEY");
  const r = await fetch("https://www.googleapis.com/youtube/v3/" + path + "?" + new URLSearchParams({ ...params, key }));
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || ("HTTP " + r.status));
  return j;
}
function parseEntry(s) {
  s = String(s).trim(); if (!s) return null;
  let m;
  if ((m = s.match(/(?:[?&]v=|youtu\.be\/|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/))) return { type: "video", id: m[1] };
  if ((m = s.match(/(UC[\w-]{22})/))) return { type: "id", id: m[1] };
  if ((m = s.match(/@([^\/?#\s]+)/))) return { type: "handle", id: "@" + decodeURIComponent(m[1]) };
  return null;
}
const chunk = (a, n) => { const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o; };

async function resolveChannelIds(list) {
  const cache = LS.get("resolved", {});
  const ids = [], vidIds = [], unresolved = [];
  for (const raw of list) {
    const e = parseEntry(raw);
    if (!e) { unresolved.push(raw); continue; }
    const k = e.type + ":" + e.id;
    if (cache[k]) { ids.push(cache[k]); continue; }
    if (e.type === "id") { ids.push(e.id); cache[k] = e.id; }
    else if (e.type === "video") vidIds.push(e.id);
    else {
      try {
        const j = await api("channels", { part: "id", forHandle: e.id });
        if (j.items && j.items[0]) { cache[k] = j.items[0].id; ids.push(j.items[0].id); } else unresolved.push(raw);
      } catch (err) { if (err.message === "NO_KEY") throw err; unresolved.push(raw); }
    }
  }
  for (const part of chunk(vidIds, 50)) {
    const j = await api("videos", { part: "snippet", id: part.join(",") });
    for (const it of j.items || []) { cache["video:" + it.id] = it.snippet.channelId; ids.push(it.snippet.channelId); }
  }
  LS.set("resolved", cache);
  if (unresolved.length) toast(T("notFound")(unresolved.join(" , ")), 6000);
  return [...new Set(ids)];
}
async function loadChannelInfo(ids) {
  const out = [];
  for (const part of chunk(ids, 50)) {
    const j = await api("channels", { part: "snippet,contentDetails", id: part.join(",") });
    for (const it of j.items || []) {
      const th = it.snippet.thumbnails || {};
      out.push({ id: it.id, title: it.snippet.title, thumb: (th.medium || th.default || {}).url || "", uploads: it.contentDetails.relatedPlaylists.uploads });
    }
  }
  out.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
  return out;
}
function isoDur(s) {
  const m = /P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(s || "") || [];
  return (+m[1] || 0) * 86400 + (+m[2] || 0) * 3600 + (+m[3] || 0) * 60 + (+m[4] || 0);
}
async function fetchUploads(ch, pageToken) {
  const p = { part: "contentDetails", playlistId: ch.uploads, maxResults: 50 };
  if (pageToken) p.pageToken = pageToken;
  const pl = await api("playlistItems", p);
  const ids = (pl.items || []).map(i => i.contentDetails.videoId);
  let items = [];
  if (ids.length) {
    const d = await api("videos", { part: "snippet,contentDetails,status", id: ids.join(",") });
    items = (d.items || [])
      .filter(v => v.status && v.status.embeddable !== false && v.status.privacyStatus !== "private" && (v.snippet.liveBroadcastContent || "none") === "none")
      .map(v => { const th = v.snippet.thumbnails || {}; return { id: v.id, ch: ch.id, title: v.snippet.title, thumb: (th.high || th.medium || th.default || {}).url || "", at: Date.parse(v.snippet.publishedAt), dur: isoDur(v.contentDetails.duration) }; });
  }
  return { items, next: pl.nextPageToken || null };
}
function saveVids() {
  const slim = {}; for (const k in vids) slim[k] = { items: vids[k].items.slice(0, 300), next: vids[k].next };
  LS.set("vids", slim);
}
async function refresh(force, silent) {
  if (busy) return;
  if (!apiKey()) { render(); return; }
  if (!force && Date.now() - lastFetch < CONFIG.REFRESH_MINUTES * 60e3 && channels.length) return;
  busy = true; $("#refreshBtn").classList.add("spin"); render();
  try {
    const ids = await resolveChannelIds(channelList());
    channels = await loadChannelInfo(ids);
    LS.set("chInfo", channels);
    const results = await Promise.allSettled(channels.map(ch => fetchUploads(ch)));
    let fresh = 0;
    results.forEach((r, i) => {
      const ch = channels[i];
      if (r.status !== "fulfilled") return;
      const old = vids[ch.id] || { items: [], next: null };
      const known = new Set(old.items.map(v => v.id));
      fresh += r.value.items.filter(v => !known.has(v.id)).length;
      const map = new Map(); [...r.value.items, ...old.items].forEach(v => map.set(v.id, v));
      vids[ch.id] = { items: [...map.values()].sort((a, b) => b.at - a.at), next: old.items.length > r.value.items.length ? old.next : r.value.next };
    });
    const keep = new Set(channels.map(c => c.id));
    Object.keys(vids).forEach(k => { if (!keep.has(k)) delete vids[k]; });
    lastFetch = Date.now(); saveVids(); LS.set("lastFetch", lastFetch);
    if (force && !silent) toast(fresh && lastFetchHadData ? T("newVids")(fresh) : T("upToDate"));
    lastFetchHadData = true; lastError = "";
  } catch (e) {
    lastError = e.message;
    toast(e.message === "NO_KEY" ? T("needKey") : T("problem")(e.message), 6000);
  } finally { busy = false; $("#refreshBtn").classList.remove("spin"); render(); }
}
async function loadMore() {
  const ch = channels.find(c => c.id === current); const st = vids[current];
  if (!ch || !st || !st.next) return;
  const btn = $("#moreBtn"); if (btn) { btn.disabled = true; btn.textContent = T("loading"); }
  try {
    const r = await fetchUploads(ch, st.next);
    const map = new Map(); [...st.items, ...r.items].forEach(v => map.set(v.id, v));
    vids[current] = { items: [...map.values()].sort((a, b) => b.at - a.at), next: r.next };
    saveVids();
  } catch (e) { toast(T("moreFail")(e.message)); }
  render();
}

/* ---------- views ---------- */
const seenOf = id => (seen[id] ?? firstSeenDefault);
const isNew = v => v.at > (viewSeen[v.ch] ?? seenOf(v.ch)) && !watched.has(v.id);
const passes = v => (!opts().hideShorts || v.dur > 60) && (!query || v.title.toLowerCase().includes(query));
const newCount = chId => ((vids[chId] || {}).items || []).filter(v => v.at > seenOf(chId) && !watched.has(v.id) && passes(v)).length;
function fmtDur(s) { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); }
function ago(t) {
  const d = (Date.now() - t) / 1000, a = T("ago");
  if (d < 3600) return a(Math.max(1, Math.round(d / 60)), "m");
  if (d < 86400) return a(Math.round(d / 3600), "h");
  if (d < 86400 * 30) return a(Math.round(d / 86400), "d");
  if (d < 86400 * 365) return a(Math.round(d / 86400 / 30), "mo");
  return a(Math.round(d / 86400 / 365), "y");
}
let currentList = [];
function listFor(view) {
  if (view === "all") { let all = []; for (const k in vids) all = all.concat(vids[k].items); return all.filter(passes).sort((a, b) => b.at - a.at).slice(0, 200); }
  return ((vids[view] || {}).items || []).filter(passes);
}

      : `<div class="msg" style="grid-column:1/-1">${query ? T("noMatch") : T("noVideos")}</div>`;
    return;
  }
  const chName = id => (channels.find(c => c.id === id) || {}).title || "";
  grid.innerHTML = currentList.map((v, i) => `
    <button class="v" data-i="${i}">
      <div class="th" style="background-image:url('${esc(v.thumb)}')">
        ${isNew(v) ? `<span class="new">${T("newTag")}</span>` : ""}
        ${v.dur ? `<span class="dur">${fmtDur(v.dur)}</span>` : ""}
        ${watched.has(v.id) ? '<span class="watched"></span>' : ""}
      </div>
      <div class="meta"><div class="t" dir="auto">${esc(v.title)}</div><div class="c">${current === "all" ? esc(chName(v.ch)) + " · " : ""}${ago(v.at)}</div></div>
    </button>`).join("");
  if (current !== "all" && vids[current] && vids[current].next && !query) more.innerHTML = `<button class="more" id="moreBtn">${T("older")}</button>`;
}
function openView(id) {
  if (current !== "all" && current !== id) { seen[current] = Date.now(); LS.set("seen", seen); }
  current = id;
  if (id !== "all") { viewSeen[id] = seenOf(id); seen[id] = Date.now(); LS.set("seen", seen); }
  render(); window.scrollTo({ top: 0, behavior: "smooth" });
}
$("#channels").addEventListener("click", e => { const b = e.target.closest(".ch"); if (b) openView(b.dataset.ch); });
$("#grid").addEventListener("click", e => { const b = e.target.closest(".v"); if (b) playAt(currentList, +b.dataset.i); });
$("#moreBox").addEventListener("click", e => { if (e.target.id === "moreBtn") loadMore(); });
$("#refreshBtn").onclick = () => refresh(true);
$("#searchToggle").onclick = () => { const s = $("#search"); s.classList.toggle("show"); if (s.classList.contains("show")) s.focus(); };
$("#search").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); if (query && current !== "all") current = "all"; render(); });

/* ---------- Player ---------- */
const P = $("#player");
let yt = null, ytReady = false, ytKey = "", pendingId = null, playlist = [], idx = 0, ticker = null, seeking = false, ccApplied = null;
const rate = () => LS.get("rate", 1);
const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];
const ICON_PLAY = '<path d="M8 5v14l11-7z"/>', ICON_PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
const ICON_FS = '<path d="M5 5h5V3H3v7h2zm9-2v2h5v5h2V3zm5 16h-5v2h7v-7h-2zM5 14H3v7h7v-2H5z"/>', ICON_FS_EXIT = '<path d="M8 3v5H3v2h7V3zm8 0h-2v7h7V8h-5zM3 16h5v5h2v-7H3zm11 5h2v-5h5v-2h-7z"/>';

function paintSpeed() {
  $("#pSpeed").textContent = rate() + "x";
  $("#speedMenu").innerHTML = SPEEDS.map(s => `<button data-rate="${s}" class="${s === rate() ? "sel" : ""}">${s}x</button>`).join("");
}
function paintVol() { const m = LS.get("muted", false); $("#pMute").textContent = m ? "🔇" : "🔊"; $("#vol").value = LS.get("vol", 100); }
function paintCC() { $("#pCC").classList.toggle("on", LS.get("cc", false)); }
function setPlayIcon(playing) { $("#playIco").innerHTML = playing ? ICON_PAUSE : ICON_PLAY; }
paintSpeed(); paintVol(); paintCC();

function loadYTApi() {
  if (window.YT && window.YT.Player) return createPlayer();
  if (!loadYTApi.started) { loadYTApi.started = true; const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s); }
}
window.onYouTubeIframeAPIReady = () => createPlayer();
function wantedKey() { return lang + "|" + (opts().kidLock ? "kid" : "yt"); }
function ensurePlayer() {
  if (yt && ytKey !== wantedKey()) {      // language or mode changed → rebuild the player
    try { yt.destroy(); } catch {}
    yt = null; ytReady = false;
  }
  if (!document.getElementById("ytp")) $("#frameBox").insertAdjacentHTML("afterbegin", '<div id="ytp"></div>');
  if (!yt) loadYTApi();
}
function createPlayer() {
  if (yt || !P.classList.contains("open") && !pendingId) return;
  const kid = opts().kidLock; ytKey = wantedKey();
  yt = new YT.Player("ytp", {
    width: "100%", height: "100%", host: "https://www.youtube.com",
    playerVars: { rel: 0, playsinline: 1, modestbranding: 1, iv_load_policy: 3, autoplay: 1, controls: kid ? 0 : 1, fs: kid ? 0 : 1, disablekb: kid ? 1 : 0, hl: lang, cc_lang_pref: lang, origin: location.origin },
    events: {
      onReady: () => { ytReady = true; yt.setVolume(LS.get("vol", 100)); if (LS.get("muted", false)) yt.mute(); if (pendingId) { yt.loadVideoById(pendingId); pendingId = null; } },
      onStateChange: e => {
        if (e.data === YT.PlayerState.PLAYING) { try { yt.setPlaybackRate(rate()); } catch {} setPlayIcon(true); applyCC(); idleSoon(); }
        else if (e.data === YT.PlayerState.PAUSED) { setPlayIcon(false); wake(); }
        else if (e.data === YT.PlayerState.ENDED) next();
      },
      onError: e => { $("#pErrMsg").textContent = T("err")[e.data] || T("errN")(e.data); $("#pErr").classList.add("show"); wake(); }
    }
  });
}
function applyCC() {
  const on = LS.get("cc", false), vid = playlist[idx] && playlist[idx].id;
  if (ccApplied === vid + on) return; ccApplied = vid + on;
  try {
    if (on) { yt.loadModule("captions"); yt.setOption("captions", "track", { languageCode: lang }); }
    else yt.unloadModule("captions");
  } catch {}
}
function playAt(list, i) {
  playlist = list.slice(); idx = i;
  P.classList.add("open"); P.classList.toggle("kid", opts().kidLock); P.setAttribute("aria-hidden", "false");
  $("#pTv").style.display = opts().showTv ? "" : "none";
  if (!history.state || !history.state.player) history.pushState({ player: 1 }, "");
  document.body.style.overflow = "hidden";
  ensurePlayer(); start();
  clearInterval(ticker); ticker = setInterval(tick, 500);
  wake();
}
function start() {
  const v = playlist[idx]; if (!v) return;
  $("#pTitle").textContent = v.title; $("#pErr").classList.remove("show"); ccApplied = null;
  $("#seek").value = 0; $("#tCur").textContent = "0:00"; $("#tDur").textContent = fmtDur(v.dur);
  watched.add(v.id); LS.set("watched", [...watched].slice(-3000));
  if (ytReady) yt.loadVideoById(v.id); else { pendingId = v.id; ensurePlayer(); }
}
function tick() {
  if (!ytReady || seeking) return;
  try {
    const d = yt.getDuration() || 0, c = yt.getCurrentTime() || 0;
    if (d) { $("#seek").max = d; $("#seek").value = c; $("#tDur").textContent = fmtDur(d); }
    $("#tCur").textContent = fmtDur(c);
    setPlayIcon(yt.getPlayerState() === YT.PlayerState.PLAYING);
  } catch {}
}
function next() { if (idx < playlist.length - 1) { idx++; start(); } else closePlayer(true); }
function prev() { if (idx > 0) { idx--; start(); } }
function togglePlay() {
  if (!ytReady) return;
  const playing = yt.getPlayerState() === YT.PlayerState.PLAYING;
  playing ? yt.pauseVideo() : yt.playVideo();
  const b = $("#bigIcon"); b.textContent = playing ? "❚❚" : "▶"; b.classList.add("show"); clearTimeout(b.h); b.h = setTimeout(() => b.classList.remove("show"), 600);
}
function closePlayer(fromCode) {
  if (!P.classList.contains("open")) return;
  try { yt && yt.stopVideo(); } catch {}
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  P.classList.remove("open", "fs", "fake-fs", "idle"); P.setAttribute("aria-hidden", "true");
  clearInterval(ticker); $("#speedMenu").classList.remove("open");
  document.body.style.overflow = "";
  if (fromCode && history.state && history.state.player) history.back();
  render();
}
window.addEventListener("popstate", () => { if ($("#tvModal").classList.contains("open")) $("#tvModal").classList.remove("open"); closePlayer(false); });

// show controls on activity, hide them after 3s while playing in full screen
function wake() { P.classList.remove("idle"); idleSoon(); }
function idleSoon() {
  clearTimeout(wake.h);
  wake.h = setTimeout(() => { try { if (P.classList.contains("fs") && yt.getPlayerState() === YT.PlayerState.PLAYING && !$("#speedMenu").classList.contains("open")) P.classList.add("idle"); } catch {} }, 3000);
}
P.addEventListener("pointermove", wake);
P.addEventListener("pointerdown", wake);
$("#tap").addEventListener("click", () => { if (P.classList.contains("fs") && P.classList.contains("idle")) { wake(); return; } togglePlay(); });
$("#tap").addEventListener("dblclick", toggleFs);

$("#pClose").onclick = () => closePlayer(true);
$("#pNext").onclick = next; $("#pPrev").onclick = prev; $("#pErrNext").onclick = next;
$("#pPlay").onclick = togglePlay;
const jump = s => { if (ytReady) { yt.seekTo(Math.max(0, (yt.getCurrentTime() || 0) + s), true); tick(); } };
$("#pBack").onclick = () => jump(-10); $("#pFwd").onclick = () => jump(10);
$("#seek").addEventListener("input", () => { seeking = true; $("#tCur").textContent = fmtDur(+$("#seek").value); });
$("#seek").addEventListener("change", () => { if (ytReady) yt.seekTo(+$("#seek").value, true); seeking = false; });
$("#pSpeed").onclick = e => { e.stopPropagation(); $("#speedMenu").classList.toggle("open"); };
$("#speedMenu").addEventListener("click", e => {
  const b = e.target.closest("[data-rate]"); if (!b) return;
  LS.set("rate", +b.dataset.rate); paintSpeed(); $("#speedMenu").classList.remove("open");
  try { yt && yt.setPlaybackRate(+b.dataset.rate); } catch {}
});
document.addEventListener("click", e => { if (!e.target.closest("#speedMenu,#pSpeed")) $("#speedMenu").classList.remove("open"); });
$("#vol").addEventListener("input", e => { const v = +e.target.value; LS.set("vol", v); LS.set("muted", false); if (ytReady) { yt.unMute(); yt.setVolume(v); } paintVol(); });
$("#pMute").onclick = () => { const m = !LS.get("muted", false); LS.set("muted", m); if (ytReady) m ? yt.mute() : yt.unMute(); paintVol(); };
$("#pCC").onclick = () => { const on = !LS.get("cc", false); LS.set("cc", on); paintCC(); ccApplied = null; if (ytReady) applyCC(); toast(on ? T("ccOn") : T("ccOff"), 1500); };

async function toggleFs() {
  const inFs = document.fullscreenElement || P.classList.contains("fake-fs");
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else if (P.classList.contains("fake-fs")) { P.classList.remove("fake-fs", "fs"); paintFs(); }
    else if (P.requestFullscreen) { await P.requestFullscreen(); try { await screen.orientation.lock("landscape"); } catch {} }
    else { P.classList.add("fake-fs", "fs"); paintFs(); }       // iPhone: no full-screen API for pages
  } catch { if (!inFs) { P.classList.add("fake-fs", "fs"); paintFs(); } }
}
function paintFs() { $("#fsIco").innerHTML = P.classList.contains("fs") ? ICON_FS_EXIT : ICON_FS; wake(); }
document.addEventListener("fullscreenchange", () => { P.classList.toggle("fs", !!document.fullscreenElement); paintFs(); });
$("#pFs").onclick = toggleFs;

// TV: Google only allows the YouTube app to cast YouTube videos, so explain and hand off
$("#pTv").onclick = () => { try { yt.pauseVideo(); } catch {} if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); $("#tvModal").classList.add("open"); };
$("#tvGo").onclick = () => {
  $("#tvModal").classList.remove("open");
  const v = playlist[idx]; if (!v) return;
  let t = 0; try { t = Math.floor(yt.getCurrentTime() || 0); } catch {}
  const web = `https://www.youtube.com/watch?v=${v.id}${t ? "&t=" + t + "s" : ""}`;
  if (/Android/i.test(navigator.userAgent)) location.href = `intent://www.youtube.com/watch?v=${v.id}${t ? "&t=" + t : ""}#Intent;package=com.google.android.youtube;scheme=https;S.browser_fallback_url=${encodeURIComponent(web)};end`;
  else window.open(web, "_blank");
  toast(T("tvToast"), 6000);
};

/* ---------- Settings / Admin ---------- */
const openModal = id => $(id).classList.add("open");
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => b.closest(".modal").classList.remove("open"));
let db = null, auth = null;
const FB_V = "10.12.2";
const loadScript = u => new Promise((res, rej) => { const s = document.createElement("script"); s.src = u; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
const fbErr = e => T("fb")[e && e.code] || (e && e.message) || String(e);

async function initFirebase() {
  const base = `https://www.gstatic.com/firebasejs/${FB_V}/`;
  await loadScript(base + "firebase-app-compat.js");
  await Promise.all([loadScript(base + "firebase-auth-compat.js"), loadScript(base + "firebase-firestore-compat.js")]);
  firebase.initializeApp(CONFIG.FIREBASE);
  db = firebase.firestore(); auth = firebase.auth();
  try { await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION); } catch {}
  // live: when an admin saves, every open app picks it up
  db.collection("app").doc("config").onSnapshot(d => {
    const before = JSON.stringify([apiKey(), channelList(), opts()]);
    const x = d.exists ? d.data() : null;
    remoteCfg = x ? { apiKey: x.apiKey || "", channels: x.channels || [], hideShorts: !!x.hideShorts, kidLock: (x.kidLock ?? x.shield) !== false, showTv: x.showTv !== false } : null;
    LS.set("remoteCfg", remoteCfg);
    if (JSON.stringify([apiKey(), channelList()]) !== JSON.stringify(JSON.parse(before).slice(0, 2))) { lastError = ""; refresh(true, true); } else render();
  }, e => console.warn("config", e));
}
const fbReady = REMOTE ? initFirebase().catch(e => { console.warn(e); toast(T("fbDown")); }) : Promise.resolve();
const isAdmin = async email => !!email && (await db.collection("admins").doc(email.toLowerCase()).get()).exists;

$("#settingsBtn").onclick = async () => {
  if (!REMOTE) { $("#pinInput").value = ""; openModal("#pinModal"); setTimeout(() => $("#pinInput").focus(), 50); return; }
  await fbReady;
  if (!auth) return toast(T("fbDown"));
  try { if (auth.currentUser && await isAdmin(auth.currentUser.email)) return openSettings(); } catch {}
  $("#lPass").value = ""; openModal("#loginModal"); setTimeout(() => $("#lEmail").focus(), 50);
};
function checkPin() {
  if ($("#pinInput").value === String(pin())) { $("#pinModal").classList.remove("open"); openSettings(); }
  else { toast(T("wrongPin")); $("#pinInput").value = ""; }
}
$("#pinOk").onclick = checkPin;
$("#pinInput").addEventListener("keydown", e => { if (e.key === "Enter") checkPin(); });
async function doLogin() {
  const email = $("#lEmail").value.trim().toLowerCase(), pw = $("#lPass").value;
  const b = $("#lOk"); b.disabled = true;
  try {
    await auth.signInWithEmailAndPassword(email, pw);
    if (!(await isAdmin(email))) { await auth.signOut(); toast(T("notAdmin")); return; }
    $("#loginModal").classList.remove("open"); openSettings();
  } catch (e) { toast(fbErr(e)); }
  finally { b.disabled = false; }
}
$("#lOk").onclick = doLogin;
$("#lPass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
$("#lForgot").onclick = async () => {
  const email = $("#lEmail").value.trim();
  if (!email) return toast(T("emailFirst"));
  try { await auth.sendPasswordResetEmail(email); toast(T("resetSent"), 5000); } catch (e) { toast(fbErr(e)); }
};
function openSettings() {
  const o = opts();
  $("#sKey").value = apiKey();
  $("#sCh").value = channelList().join("\n");
  $("#sShorts").checked = o.hideShorts; $("#sKid").checked = o.kidLock; $("#sTv").checked = o.showTv; $("#sPin").value = "";
  $("#keyHint").textContent = REMOTE ? T("keyHintRemote") : T("keyHintLocal");
  $("#pinBox").style.display = REMOTE ? "none" : "";
  $("#adminsBox").style.display = REMOTE ? "" : "none";
  $("#sLogout").style.display = REMOTE ? "" : "none";
  if (REMOTE) { $("#whoami").textContent = T("signedAs") + auth.currentUser.email; loadAdmins(); }
  openModal("#setModal");
}
async function loadAdmins() {
  const box = $("#adminsList"); box.textContent = "...";
  try {
    const snap = await db.collection("admins").get();
    const me = auth.currentUser.email.toLowerCase();
    box.innerHTML = snap.docs.map(d => `<div class="adm"><span>${esc(d.id)}</span>${d.id === me ? `<small>${T("you")}</small>` : `<button data-del="${esc(d.id)}">${T("remove")}</button>`}</div>`).join("") || T("none");
  } catch (e) { box.textContent = fbErr(e); }
}
function confirmTwice(btn) {   // tap once → "Sure?", tap again within 3s → do it
  if (btn.dataset.sure) return true;
  btn.dataset.sure = 1; const t = btn.textContent; btn.textContent = T("sure");
  setTimeout(() => { delete btn.dataset.sure; btn.textContent = t; }, 3000);
  return false;
}
$("#adminsList").addEventListener("click", async e => {
  const id = e.target.dataset && e.target.dataset.del; if (!id) return;
  if (!confirmTwice(e.target)) return;
  try { await db.collection("admins").doc(id).delete(); toast(T("removed")(id)); loadAdmins(); } catch (err) { toast(fbErr(err)); }
});
$("#aAdd").onclick = async () => {
  const email = $("#aEmail").value.trim().toLowerCase(), pw = $("#aPass").value;
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast(T("badEmail"));
  const b = $("#aAdd"); b.disabled = true;
  try {
    if (pw) {   // create the account on a second Firebase instance so the current admin stays signed in
      const sec = firebase.apps.find(a => a.name === "sec") || firebase.initializeApp(CONFIG.FIREBASE, "sec");
      try { await sec.auth().createUserWithEmailAndPassword(email, pw); } catch (e) { if (e.code !== "auth/email-already-in-use") throw e; }
      await sec.auth().signOut();
    }
    await db.collection("admins").doc(email).set({ addedBy: auth.currentUser.email, at: firebase.firestore.FieldValue.serverTimestamp() });
    $("#aEmail").value = ""; $("#aPass").value = "";
    toast(T("added")(email)); loadAdmins();
  } catch (e) { toast(fbErr(e)); }
  finally { b.disabled = false; }
};
$("#sLogout").onclick = async () => { try { await auth.signOut(); } catch {} $("#setModal").classList.remove("open"); toast(T("loggedOut")); };
$("#sSave").onclick = async () => {
  const data = {
    apiKey: $("#sKey").value.replace(/[\s"']/g, ""),
    channels: $("#sCh").value.split(/\n+/).map(x => x.trim()).filter(Boolean),
    hideShorts: $("#sShorts").checked, kidLock: $("#sKid").checked, showTv: $("#sTv").checked
  };
  const b = $("#sSave"); b.disabled = true;
  try {
    if (REMOTE) {
      await db.collection("app").doc("config").set({ ...data, updatedBy: auth.currentUser.email, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
      toast(T("saved"));
    } else {
      data.apiKey && data.apiKey !== CONFIG.API_KEY ? LS.set("apiKey", data.apiKey) : LS.del("apiKey");
      data.channels.join("\n") === CONFIG.CHANNELS.join("\n") ? LS.del("channels") : LS.set("channels", data.channels);
      LS.set("opts", { hideShorts: data.hideShorts, kidLock: data.kidLock, showTv: data.showTv });
      const np = $("#sPin").value.trim(); if (np) LS.set("pin", np);
      lastError = ""; refresh(true); toast(T("savedLocal"));
    }
    $("#setModal").classList.remove("open"); current = "all"; render();
  } catch (e) { toast(fbErr(e)); }
  finally { b.disabled = false; }
};
$("#sDefaults").onclick = () => { $("#sCh").value = CONFIG.CHANNELS.join("\n"); };
$("#sClear").onclick = () => { ["vids", "chInfo", "lastFetch", "resolved"].forEach(LS.del); vids = {}; channels = []; lastFetch = 0; toast(T("cacheCleared")); refresh(true, true); };

/* ---------- boot ---------- */
applyLang();
render();
refresh(false);
setInterval(() => { if (document.visibilityState === "visible") refresh(false); }, 5 * 60e3);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(false); });
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
